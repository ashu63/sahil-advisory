<!doctype html>
<meta charset="utf-8" />
<title>Sahil Advisory logo concepts</title>
<style>
  body { font: 14px/1.5 ui-sans-serif, system-ui, sans-serif; color: #0f172a; margin: 40px; background: #f6f8fb; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.sub { color: #64748b; margin: 0 0 32px; }
  .row { display: flex; gap: 24px; align-items: center; padding: 20px; background: #fff; border: 1px solid #e5e9f0; border-radius: 12px; margin-bottom: 16px; }
  .row.dark { background: #0b1f3a; border-color: #0b1f3a; }
  .row.dark .name, .row.dark .size { color: rgba(255,255,255,.7); }
  .name { width: 160px; font-weight: 600; }
  .sizes { display: flex; gap: 28px; align-items: flex-end; }
  .cell { text-align: center; }
  .size { font: 11px ui-monospace, monospace; color: #64748b; margin-top: 8px; }
  .note { color: #64748b; margin: 28px 0 12px; font-weight: 600; }
</style>

<h1>Sahil Advisory logo concepts</h1>
<p class="sub">Navy #0b1f3a + emerald #059669. No gold. Judge the 32px column first.</p>

<div id="out"></div>

<script>
  const marks = [
    ['Ledger tick', '01-ledger-tick.svg'],
    ['Tabular columns', '02-tabular-columns.svg'],
    ['Bracket mark', '03-bracket-mark.svg'],
  ];
  const sizes = [128, 64, 32];
  const out = document.getElementById('out');
  for (const dark of [false, true]) {
    if (dark) {
      const note = document.createElement('div');
      note.className = 'note';
      note.textContent =
        'On navy, as-is. The navy strokes disappear by design: these files are the light-ground masters, and each needs a dark variant with #0b1f3a swapped for #ffffff.';
      out.appendChild(note);
    }
    for (const [name, file] of marks) {
      const row = document.createElement('div');
      row.className = 'row' + (dark ? ' dark' : '');
      row.innerHTML =
        `<div class="name">${name}${dark ? ' (on navy)' : ''}</div>` +
        `<div class="sizes">` +
        sizes.map(s => `<div class="cell"><img src="${file}" width="${s}" height="${s}" alt="${name}"><div class="size">${s}px</div></div>`).join('') +
        `</div>`;
      out.appendChild(row);
    }
  }
</script>
